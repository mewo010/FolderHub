name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp ~/.android/debug.keystore ./debug.keystore || true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Build Android APK
        run: |
          # If signing secrets are provided, setup release keystore and build release APK; otherwise assemble debug APK
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            export STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate Built APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          # Copy to a clean standard filename for release asset
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/HubLauncher-app.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-launcher-apk
          path: artifacts/HubLauncher-app.apk
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Run release job if push is a version tag or on main branch
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-launcher-apk
          path: release-assets

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          else
            TAG_NAME="v1.0.0-snapshot-$(date +'%Y%m%d%H%M%S')"
            PRERELEASE="true"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: Release ${{ steps.release_info.outputs.tag_name }}
          body: |
            ## Hub Launcher / App Folder Hub
            Automated build from commit `${{ github.sha }}`.

            ### Assets
            - `HubLauncher-app.apk`: Ready-to-install Android application package.
          files: release-assets/HubLauncher-app.apk
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
